[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fantasy-football-26"
version = "0.1.0"
description = "A transparent Yahoo PPR fantasy-football draft optimizer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ff-draft = "fantasy_draft.cli:main"

[tool.setuptools.packages.find]
include = ["fantasy_draft*"]
